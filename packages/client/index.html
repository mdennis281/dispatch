    <meta charset="UTF-8" />
    <!-- No `viewport-fit=cover`, on purpose. With it, the installed iOS app's
         window shrank by the status bar (932 -> 873) on the first keyboard and
         never recovered, and nothing below the short edge was ever painted —
         eleven PRs of shell geometry could not fix it because the band was
         outside the viewport. Without it, iOS lays the window out BELOW the
         status bar and down to the bottom of the glass, and it stays put. Every
         `env(safe-area-inset-*)` is 0 in that layout, so the home-indicator
         clearance comes from `--cm-home-indicator` (stores/viewport.ts) instead.
         See docs/ios-pwa-viewport-findings.md. -->
    <!--
         `user-scalable=no` / `maximum-scale=1`: this is an app shell, not a
         document. Every pane scrolls itself and the layout already tracks the
         live viewport, so a browser zoom has nothing sensible to do — it
         magnifies a fixed box, strands the top bar off-screen and there is no
         document scroll to bring it back. iOS honours both keys in the
         INSTALLED app; a Safari tab ignores them, which is what the
         `gesturestart` guard in `lib/pageZoom.ts` is for.
         Pinch still works where it means something — the image viewer and the
         annotator, which zoom over pointer events of their own. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="color-scheme" content="dark light" />
    <title>Dispatch</title>
    <!--
      Theme, applied before the first paint.

      This is deliberately an inline, blocking script in <head>: the stylesheet
      and the app bundle both load asynchronously, so anything that sets the
      theme from JS modules lands AFTER the browser has already painted the
      default dark palette — a white flash on every load for light-theme users,
      and a dark one for anybody switching back. Setting the attribute here, in
      the same parse pass as the <html> element itself, means there is never a
      frame with the wrong palette on screen.

      Kept in sync by hand with `src/stores/theme.ts` (same storage key, same
      attribute, same resolution rules) — nothing importable can run this early.
    -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem("dispatch:theme");
          if (p !== "dark" && p !== "dim" && p !== "light" && p !== "system") p = "dark";
          var t =
            p === "system"
              ? matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : p;
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t === "light" ? "light" : "dark";
        } catch (e) {
          // Storage blocked (private mode, embedded webview). The `data-theme`
          // already on <html> is the dark default, so we simply keep it.
        }
      })();
    </script>
    <!--
      The splash's colours, picked before the first paint.

      Every road the splash draws is a different colour, and the dots it lands on
      wear the colour of the road that reached them. The first is the brand
      yellow; after that it deals from the accent set at random. So the opening
      mark is all one colour and every one after it has a dot that does not match
      the other two — the graph carrying where it has been.

      HERE, AND NOT IN THE STYLESHEET, for the same reason the theme script above
      is: this has to be decided in the same parse pass that paints the mark. And
      not in the bundle, which arrives long after the first road is down.

      IT OUTLIVES THE SPLASH. The connecting and updating screens render the
      same looping mark (components/brand/BootMark.tsx), so what this sets up is
      a DRIVER with holds taken on it, not a timer tied to one element's life. It
      ticks while anything on screen is wearing the mark and stops when nothing
      is; a consumer that mounts an hour later phase-aligns to the CSS clock,
      which has been running since the document was parsed.

      A SHUFFLED BAG, not `random()` per pick. Five colours dealt from a shuffled
      copy, reshuffled when empty, and the first of a new deal is swapped away if
      it matches the last of the old one. That gives random ORDER with no repeat
      and no colour skipped — where independent picks would happily show blue
      twice running, or never get to green at all in the three or four draws a
      boot actually has time for.

      The palettes are the app's own, by hand, per theme: `--p-accent` for the
      yellow and `--p-cat-{7,4,2,1,5}` for the rotation — which are chosen for
      even hue spacing at MATCHED LIGHTNESS, so no road in the sequence shouts
      louder than the one before it. Keep them level with src/theme/*.css.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var PALETTES = {
          /*        yellow     orange     red        green      blue       purple */
          dark:  ["#e5a33c", "#ff9e64", "#f7768e", "#9ece6a", "#7aa2f7", "#bb9af7"],
          dim:   ["#f0b45b", "#ffad79", "#ff98aa", "#afe083", "#8bb4ff", "#cbb1ff"],
          light: ["#9a5b00", "#b75415", "#c03755", "#3f7d22", "#2c5fbf", "#6e43c0"],
        };
        var palette = PALETTES[root.getAttribute("data-theme")] || PALETTES.dark;
        var rotate = palette.slice(1);
        var bag = [];
        var last = null;

        function next() {
          if (!bag.length) {
            bag = rotate.slice();
            for (var i = bag.length - 1; i > 0; i--) {
              var j = (Math.random() * (i + 1)) | 0;
              var swap = bag[i];
              bag[i] = bag[j];
              bag[j] = swap;
            }
            // Dealt from the end, so this is the one about to come out.
            if (bag[bag.length - 1] === last) bag.unshift(bag.pop());
          }
          last = bag.pop();
          return last;
        }

        var listeners = [];
        function set(name, value) {
          root.style.setProperty(name, value);
          // The canvas renderer below is a worker and cannot read a CSS
          // variable, so every change is announced as well as applied. One
          // source of truth for the rotation, two things wearing it.
          for (var i = 0; i < listeners.length; i++) listeners[i](name, value);
        }

        // Segment one opens on the brand yellow; segment two already knows what
        // it will be, because it is drawn half a cycle later and the dots that
        // receive it have to be dyed before it gets there.
        var segment1 = palette[0];
        var segment2 = next();
        set("--c-s1", segment1);
        set("--c-s2", segment2);
        set("--c-a", segment1);
        set("--c-b", segment1);
        set("--c-c", segment2);
        /*
         * The colour the EXIT's ball wears — "whatever it last was".
         *
         * Unlike the five above, this one has no dark window to respect: it is
         * read exactly once, at the instant of dismissal, and by then the ticks
         * have stopped. So it is not scheduled around visibility but around
         * TRUTH — it is set the moment a segment finishes drawing, so at any
         * instant it holds the colour of the road most recently completed, which
         * is also the colour of the dots that road has just landed on.
         *
         * Seeded here so a dismissal inside the first 432ms still has one.
         */
        set("--c-ball", segment1);

        /*
         * The rotation is a shared driver, and this is its handle.
         *
         * Defined BEFORE the reduced-motion return, as no-ops, so a consumer can
         * call `hold()` unconditionally: with reduced motion there is no loop to
         * drive and nothing to stop, but there is still a mark on screen.
         */
        var api = {
          hold: function () {
            return function () {};
          },
          releaseSplash: function () {},
          /** Called with (name, value) on every colour change, and never replayed. */
          onColour: function (fn) {
            listeners.push(fn);
          },
        };
        window.__dispatchBootMark = api;

        // With reduced motion the loop never runs: one mark, held, in yellow.
        if (typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches) return;

        /*
         * Re-dyeing, and WHEN it is safe.
         *
         * A variable can only change while nothing wearing it is on screen, or
         * the recolour happens in front of you. Against the 2100ms schedule in
         * the stylesheet, the dark windows are: segment one 1050-2100, segment
         * two 2100-3150, dot A 777-2100, dot B 1827-2457, dot C 0-1533.
         *
         * DOT B'S WINDOW CLOSES AT 2457, AND THAT NUMBER USED TO READ 2532 —
         * which is where this went wrong for a while. 2532 is 20.57%, when the
         * branches LAND on dot B. But the dot does not wait to be landed on: it
         * springs open from 17%, which is 2457. So the tick that dyed it sat at
         * 2400, a claimed 132ms clear of the edge and really 57ms, and the
         * measured lateness of a timer during boot is 131-362ms. It missed every
         * cycle, and you saw the previous colour for the frames it took to
         * arrive — on the two dots, always, right as they were drawn.
         *
         * So dot B gets its own tick, as early in its dark window as the fade
         * allows rather than as late as it fits: 1950 is 123ms after the dot is
         * fully out and 507ms before it starts coming back. Every other variable
         * already had 750ms or more, which is why only these two ever flickered.
         *
         * ALL THREE NUMBERS BELONG TO `--boot-beat`, which is the period they
         * are read against and which lives in the stylesheet, where a script
         * running before it cannot see it. This is the one genuine duplicate in
         * the splash and it cannot be removed — so retune `--boot-beat` and
         * these move with it, or the ticks drift out of the dark windows above
         * and into the lit ones, and a road changes colour while you are looking
         * at it. The declaration over there says the same thing in the other
         * direction.
         *
         * DOT A IS THE PREVIOUS CYCLE'S SEGMENT-TWO COLOUR, and that is the one
         * assignment that is not free. At the seam the loop swaps dot C for dot
         * A on the same pixel; give them different colours and the seam that the
         * whole strip is built around becomes a visible flash of the wrong hue.
         */
        var PERIOD = 2100;
        var TICKS = [
          // Segment one is fully drawn at 20.57% of the cycle. Nothing is being
          // recoloured here — the ball is not on screen — so this one is placed
          // on the truth rather than on a dark window.
          {
            at: 432,
            fn: function () {
              set("--c-ball", segment1);
            },
          },
          {
            at: 1200,
            fn: function () {
              set("--c-a", segment2);
              segment1 = next();
              set("--c-s1", segment1);
            },
          },
          // Segment two is fully drawn at 70.57%.
          {
            at: 1482,
            fn: function () {
              set("--c-ball", segment2);
            },
          },
          // Dot B, dyed the moment it is safely out of sight rather than at the
          // last moment it fits. `segment1` is already the NEXT cycle's colour
          // here, assigned by the 1200 tick above — which is also why this
          // cannot simply ride along with that one: at 1200 dot B is still lit.
          {
            at: 1950,
            fn: function () {
              set("--c-b", segment1);
            },
          },
          // 2400 rather than 300: a cycle in, on the FIRST start. The values for
          // cycle zero were set above, and calling next() any earlier would burn
          // segment two's colour before it had been drawn once. On a later start
          // there is no cycle zero to protect and it phase-aligns like the rest.
          {
            at: 2400,
            fn: function () {
              segment2 = next();
              set("--c-s2", segment2);
              set("--c-c", segment2);
            },
          },
        ];

        var timers = [];
        var holds = 0;
        var startedOnce = false;
        // Bumped by `stopTicks`, so a callback that was already in flight when
        // the last hold went away cannot re-arm itself into a stopped rotation.
        var generation = 0;

        /*
         * RE-ANCHORED EVERY TIME, rather than a `setInterval`.
         *
         * An interval repeats from when it last FIRED, so every millisecond it
         * ran late is carried into the next one and never given back. Measured
         * on an idle page that is about 3ms a cycle — dot B's tick creeping
         * 317, 321, 326, 327 — which is nothing across the 3.6s of a boot and a
         * great deal across a `ConnectingScreen` left open for ten minutes,
         * where it is 285 cycles and most of a second of drift. Long before
         * that, every tick has walked out of the dark window it was placed in.
         *
         * Computing the next delay from `performance.now()` each time means a
         * late tick is late once. It costs one extra `setTimeout` per tick per
         * cycle, which is four timers every 2.1 seconds.
         */
        function startTicks() {
          if (timers.length) return;
          var gen = ++generation;
          for (var i = 0; i < TICKS.length; i++) {
            (function (tick, slot) {
              function arm(first) {
                // `performance.now()` is ms since navigation and the CSS
                // animations are `infinite` with no delay, so the loop's phase
                // right now is `now % PERIOD` — which is what a tick has to land
                // on. On the very first start `now` is a paint or two, so the
                // authored offsets stand as written.
                var delay = first;
                if (delay == null) {
                  var now = performance.now();
                  delay = (((tick.at - now) % PERIOD) + PERIOD) % PERIOD;
                  // Dead on the phase: wait a whole cycle rather than firing
                  // twice in a row and burning a colour early.
                  if (delay < 1) delay = PERIOD;
                }
                timers[slot] = setTimeout(function () {
                  if (gen !== generation) return;
                  tick.fn();
                  arm(null);
                }, delay);
              }
              arm(startedOnce ? null : tick.at);
            })(TICKS[i], i);
          }
          startedOnce = true;
        }

        function stopTicks() {
          generation++;
          for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
          timers = [];
        }

        /*
         * A hidden tab does not keep this timer honest.
         *
         * Chrome throttles `setInterval` to once a second while the tab is in
         * the background, and to once a MINUTE after five minutes hidden. The
         * CSS animations don't care — they run off the document timeline, which
         * is wall-clock — so the two clocks come apart. Leave a connecting or
         * updating screen open in a background tab, come back, and the ticks are
         * arbitrarily far out of phase: they now land anywhere in the cycle,
         * including the lit windows, and you watch a road change colour.
         *
         * Restarting is the whole fix, because `startTicks` re-derives the phase
         * from `performance.now()`. It has to be stop-THEN-start: `startTicks`
         * returns early while timers are live, so calling it alone does nothing.
         */
        function realign() {
          if (document.visibilityState !== "visible" || !holds) return;
          stopTicks();
          startTicks();
        }

        api.hold = function () {
          holds++;
          // Attached with the first hold and dropped with the last, so nothing
          // is listening once the mark is off screen and the ticks have stopped.
          if (holds === 1) document.addEventListener("visibilitychange", realign);
          startTicks();
          var released = false;
          return function () {
            if (released) return;
            released = true;
            if (--holds <= 0) {
              document.removeEventListener("visibilitychange", realign);
              stopTicks();
            }
          };
        };

        // The splash's own hold. Released by `dismiss()` in bootSplash.ts rather
        // than by watching the element, so that a bundle which never arrives —
        // and therefore a splash which never lifts — keeps its colours turning.
        var splashRelease = api.hold();
        api.releaseSplash = function () {
          splashRelease();
        };
      })();
    </script>

    <!--
      The boot splash — the Dispatch mark, centred, for the first beat of every
      load. Deliberately here rather than in a React component: this has to paint
      on the FIRST frame, before the bundle is fetched, or it would cover the
      wrong second of the load and add a transition instead of removing one.
      `src/lib/bootSplash.ts` owns the lifetime; this owns the look. The markup
      it styles is the generated block at the top of <body>.

      ── WHAT IT DOES ────────────────────────────────────────────────────────

      The mark does not animate in place. It EXTENDS, and the frame follows it.

      A fork is the mark. A merge is the mark mirrored. So the splash lays them
      end to end and walks along the chain: the roads behind the leading dots
      undraw INTO them, the frame slides so those dots are now the leading edge
      from the left, and new roads draw OUT of their right — arriving at new
      leading dots, which are one where there were two, or two where there was
      one. One, two, one, two, and every pose is the mark, mirrored from the last.

      Nothing here fades or cross-dissolves between two states. What you are
      watching is a source-control graph branching and merging, which is what
      the mark means; drawing it is the only honest way to show it happening.

      ── THE CYCLE, AS PERCENTAGES OF ONE PERIOD ─────────────────────────────

        0%         A alone on the centre line. The pen is on it
        0 → 9.30%   the trunk draws from A to the junction. The frame slides with
                   it, keeping the half-drawn shape centred the whole way
        9.30 → 20.57%  both branches draw on from the junction to the tips,
                   frame still tracking; B lands as they arrive
        20.57 → 32%  HELD. This is the mark: one dot, two dots, dead centre.
        32 → 40.14%  the trunk retracts into the junction and A goes with its
                   tail; the frame tracks the shrinking shape
        40.14 → 50%  the branches retract into the tips. The frame arrives with
                   them: B alone, on the centre line, pen on it
        50 → 100%  the same again, mirrored — branches out to the junction, trunk
                   on to C, held, then retracted the same way, landing on C alone
                   on the centre line, which is where A was at 0%

      THE FRAME IS ALWAYS CENTRED ON THE INK, and that one rule replaces every
      schedule this went through to get here. The camera is not a sequence of
      moves between poses; it is a function of what is drawn. At any instant the
      visible shape runs from the leftmost live end to the rightmost, and the pan
      is whatever puts the middle of that on the centre line — so the mark grows
      out of the centre, sits in the centre, and shrinks back into the centre.

      Which makes it continuous for free, and continuity is the thing this was
      missing. Earlier versions moved the frame BETWEEN segments, in one lurch or
      two, and no amount of easing hides a camera that waits for a gap: the shape
      drifts off centre as it draws, snaps back, drifts again. Tracking the pen
      means the frame is already where it needs to be at every frame, and the
      only times it is still are the holds — when the pen is still too, so they
      stop together and that reads as arrival rather than as a stop.

      The pan keyframes are the pen's x at each phase boundary, turned into
      `32 − midpoint`: +20 with the pen on A at x=12, +8 at the junction, 0 at
      the tips, and so on down to −60. They are LINEAR between, because the pen
      is, and because the two have to be the same function or the tracking is
      only true at the corners. Every one of those numbers is derived — change
      the geometry or a phase split and they all move.

      IT NEVER REVERSES. 20, 8, 0, 0, −12, −20, −28, −40, −40, −48, −60: the graph
      is going one way, and a frame that slid back to recentre would say it was
      not.

      THE DOTS ARE THE PEN'S ENDS. One lands as the stroke reaches it and one
      leaves with the tail that passes it — nothing appears or disappears on its
      own schedule, which is what made an earlier pass read as two motions, a
      dot going and then a dot coming.

      THE SEAM IS AT THE LAST LINE and it is the reason two segments is enough.
      At 100% the only thing on screen is C, dead centre, at the size and colour
      A's dot has at 0%. So the loop restarts on an identical
      frame: C goes dark and A lights up on the same pixel in the same tick, and
      the 80 units of accumulated slide reset under cover of that. Change any
      number in the last three rows and check this still holds, or the splash
      develops a visible hitch once a cycle.

      ── THE EXIT: MOLD, THEN OPEN ───────────────────────────────────────────

      Two movements, and the join between them is the whole idea: the mark
      becomes a ball, and then the ball becomes the window the app is behind.

      MOLD (0 → 420ms). Whatever pose is on screen shrinks into the centre while
      a ball swells up underneath it, wearing `--c-ball` — the colour of the last
      road the loop finished drawing, so the thing left standing is the colour
      the thing that was there had just become.

      It has to be a SCALE and not the dots converging, the way a fixed logo's
      exit could be: the pose depends on where in the loop it was interrupted,
      and so does how far the frame has slid. Scaling the whole group about the
      view box's centre is the one gesture that is correct from every phase,
      mid-draw included. And the BALL cannot come from that group for the
      complementary reason: a uniform scale takes three dots to three smaller
      dots and never to one, so it can only reach a dot by reaching zero, and
      zero is not a dot.

      The stage slides its 2vh of optical lift off over the same 420ms. Up there
      it is the right place for a logo; down here the ball is about to become a
      full-screen aperture, and an aperture that opens 1vh above the middle of
      the screen is just wrong.

      OPEN (420 → 1000ms). The ball's fill drops out, its edge lights up as a
      ring, and the ring expands past the corners — with the plate gone from
      inside it the whole way, so what fills the ring is the app. The last thing
      on screen is four corners of plate, which fade.

      IT IS A HOLE, NOT A REVEAL, and that is why the plate is an SVG `<rect>`
      with a `<mask>` on it rather than the `background` it used to be. The two
      obvious ways to do this are both wrong here: `clip-path: circle()` keeps
      the INSIDE, and inverting it onto #root instead would make #root a
      containing block for every `position: fixed` child the shell has — the
      whole app would jump for the length of the animation, which is precisely
      the complaint this change exists to fix. A `<mask>` of "white rect minus
      black circle" inverts natively and costs one flat fill a frame.

      The hole and the ring are separate elements with IDENTICAL `r` keyframes,
      the same duration, delay and easing. They have to be, or the ring drifts
      off the edge it is supposed to be the edge of. `r` is animated directly —
      not a `transform: scale`, which would magnify a small rasterisation of that
      edge sixty times over and show it.

      The far radius is `71vmax`, and it is the tightest number that is correct
      on every screen. Half the viewport diagonal is `0.5·√(w² + h²)`, which on a
      square window is `0.707·vmax` and falls from there as the window gets
      wider — so 71vmax clears the corners at between 76% and 99.6% of its travel
      across every aspect ratio there is. The obvious `56vw + 56vh` also always
      clears, but on a 16:10 window the corner went by at 65% of the radius and
      the last third of the animation happened entirely off-screen.

      No glow anywhere — no wash behind the mark, no bloom on the dots. Flat
      amber on a flat plate. Every soft-light version of this read as a smudge
      at the centre of the screen rather than as light.

      And nothing else on screen: no wordmark, no caption. The caption made the
      whole thing an illustration with a label under it.
    -->
    <style>
      /* ON :root, NOT ON #boot-splash, because the splash is no longer the only
         thing wearing the mark — `ConnectingScreen` and `UpdatingScreen` render
         the same loop through components/brand/BootMark.tsx, from inside the
         app, where there is no #boot-splash to inherit from.

         Not the theme variables either: this paints before the stylesheet
         arrives, which is the whole point of it being here. Kept level with
         `--p-app` and `--p-accent` of each theme in src/theme/*.css by hand.

         `--boot-amber` is the brand yellow the sequence opens on. The five it
         rotates through live in the script in <head>, because they are chosen at
         random and only JS can do that. This is the fallback for all of them: if
         that script is blocked, every road and dot is amber and the splash is
         exactly what it was before it had colours. */
      :root {
        --boot-bg: #0b0d10;
        --boot-amber: #e5a33c;
        /* One period of the loop — two beats, one for each pose. Everything
           below is a percentage of this, so it is the only speed control. It was
           1800ms, which put 44.6 units of road down in 288ms and was too quick
           to follow the pen.

           TWO THINGS OUTSIDE THIS STYLESHEET ARE DERIVED FROM IT and neither can
           read it, so both have to be moved by hand if this changes:

             - `BOOT_SPLASH_MIN_MS` in src/lib/bootSplash.ts, which is aimed at a
               held pose so the exit does not interrupt a draw;
             - `PERIOD` and the tick offsets in the colour script in <head>,
               which recolours the roads and dots during the windows in which
               they are NOT on screen. Retune this and leave those, and a tick
               lands mid-draw and recolours a road in front of you. */
        --boot-beat: 2100ms;
      }
      html[data-theme="dim"] { --boot-bg: #25292e; --boot-amber: #f0b45b; }
      html[data-theme="light"] { --boot-bg: #e9edf2; --boot-amber: #9a5b00; }

      #boot-splash {
        /* Above LAYER.shutdown (600, src/lib/layers.ts) — the app has not
           started yet, so nothing it can raise belongs over this. */
        position: fixed;
        inset: 0;
        z-index: 700;
        display: grid;
        place-items: center;
        /* NO `background` here. The plate is the `<rect>` inside
           `.boot-splash__iris` below, because the exit has to punch a hole in it
           and only the SVG can be masked. */
      }

      /* Still a little above true centre — optical centre sits high of
         geometric centre — but only just, now that the mark is alone: the 6vh
         that balanced a wordmark underneath reads as the logo having drifted. */
      .boot-splash__stage {
        position: relative;
        display: flex;
        align-items: center;
        margin-bottom: 2vh;
        will-change: transform, opacity;
      }

      /* Bigger than the mark's own box on purpose. The SVG relies on
         `overflow: visible` because the strip is 80 units longer than the view
         box; a canvas has no such escape, so it is given room instead. Anything
         out there is undrawn or at zero alpha, so the extra area costs a clear
         and nothing else — and clipping a road mid-draw would be a real defect.

         Inside `.boot-splash__stage`, so the exit's `boot-splash-settle` moves
         the canvas and the SVG together rather than sliding one out from under
         the other. */
      .boot-splash__canvas {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 320px;
        height: 320px;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      /* The handover. `display: none` and not `visibility: hidden`: a hidden
         SVG keeps ticking its eleven animations and keeps paying style recalc
         on the thread this exists to free, which would give back most of what
         was won. `display: none` stops them outright.

         Set only once the worker has a frame up, and removed again if it ever
         errors — so the SVG is on screen for every moment the canvas is not. */
      #boot-splash:not([data-canvas]) .boot-splash__canvas { display: none; }
      #boot-splash[data-canvas] .boot-splash__mark { display: none; }

      /* Bigger than the mark ever appears in the app. `overflow: visible` is
         load-bearing rather than defensive: the strip is 80 units longer than
         the view box, and the segment that is not currently centred hangs off
         the right of it. Everything out there is undrawn or at zero opacity, so
         it costs nothing — but clip it and the roads would be cut off mid-slide
         at the frame's edge instead of arriving. */
      .boot-splash__mark {
        display: block;
        width: var(--boot-mark-size, 116px);
        height: var(--boot-mark-size, 116px);
        overflow: visible;
      }

      /*
       * THE FRAME SLIDE — the pen's x, centred.
       *
       * Every value here is `32 − (leftEnd + rightEnd) / 2` at a phase boundary,
       * in view-box units: the pen starts on A at x=12 against a left end of 12,
       * so +20; it reaches the junction at 36 for +8; the tips at 52 for 0. The
       * retract does the same from the other side as the left end walks right.
       * See the docblock above — these are derived, not chosen.
       *
       * LINEAR, and it has to be: the roads draw at a constant rate, so anything
       * else here would only be centred at the corners and drifting in between.
       * The branch phases approximate slightly — a cubic's x does not advance
       * quite linearly with its arc length — but measured against the real path
       * the worst error is 0.66 units, about a pixel at the size this renders.
       *
       * It never reverses, and the flat stretches are the held poses: nothing is
       * being drawn, so the middle of the shape is not moving either.
       */
      .boot-splash__pan {
        transform-box: view-box;
        animation: boot-splash-pan var(--boot-beat) linear infinite;
      }
      @keyframes boot-splash-pan {
        0% { transform: translateX(20px); }
        9.3% { transform: translateX(8px); }
        20.57%,
        32% { transform: translateX(0); }
        40.14% { transform: translateX(-12px); }
        50% { transform: translateX(-20px); }
        61.27% { transform: translateX(-28px); }
        70.57%,
        82% { transform: translateX(-40px); }
        91.86% { transform: translateX(-48px); }
        100% { transform: translateX(-60px); }
      }

      /*
       * THE ROADS — draw out of one anchor, retract into the next.
       *
       * `pathLength="1"` on every path (see generate-brand.mjs) normalises the
       * dash maths, so a short branch takes the same time as the long trunk — a
       * graph growing at one speed, not three.
       *
       * Offset +1.06 is "not yet drawn", 0 is "drawn", -1.06 is "retracted into
       * my END" — one direction for every stroke in the strip, because a path's
       * point order already says which way it runs. That is the invariant
       * `mirrorBranch` in generate-brand.mjs reverses its points to maintain.
       *
       * The ±1.06 overshoot, and `1 3` rather than `1`: with `stroke-dasharray:
       * 1` a fully retracted stroke settles at exactly ±1, where the dash
       * boundary lands ON the path end — a ZERO-LENGTH dash, which
       * `stroke-linecap: round` faithfully paints as a filled 4.5px circle, so
       * the mark appears to keep a dot it has just retracted past. Overshooting
       * alone is not enough: at offset 1.06 against a gap of 1 the NEXT dash
       * reappears at 0.94 and redraws the tail. The gap has to outrun the
       * overshoot.
       *
       * Four animations rather than two: each segment is drawn in two phases
       * through its junction (see BOOT_ROAD_PHASE), so `--1a` is the fork's
       * trunk, `--1b` its two branches, `--2a` the merge's two branches and
       * `--2b` its trunk. Nothing is staggered within a phase — the branches of
       * a fork split at the same instant, because they are one event.
       */
      .boot-splash__road {
        fill: none;
        /* Fallback all the way down to the amber, so a blocked inline script
           costs the colours and nothing else. */
        stroke: var(--boot-amber);
        stroke-width: var(--bsw, 4.5);
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1 3;
        stroke-dashoffset: 1.06;
        animation-duration: var(--boot-beat);
        animation-iteration-count: infinite;
      }
      .boot-splash__road--1a,
      .boot-splash__road--1b { stroke: var(--c-s1, var(--boot-amber)); }
      .boot-splash__road--2a,
      .boot-splash__road--2b { stroke: var(--c-s2, var(--boot-amber)); }
      .boot-splash__road--1a { animation-name: boot-splash-road-1a; }
      .boot-splash__road--1b { animation-name: boot-splash-road-1b; }
      .boot-splash__road--2a { animation-name: boot-splash-road-2a; }
      .boot-splash__road--2b { animation-name: boot-splash-road-2b; }

      /* THE SPLIT IS 45.2 / 54.8, AND IT IS NOT THE ARC LENGTHS. Those are 24
         units of trunk against 20.6 of branch, which would be 53.8/46.2 — and
         that is what this was, because it makes the pen measurably constant:
         one stroke advancing along itself at one rate through the junction.

         It does not LOOK constant, and the reason is that a fork has two
         branches drawing at the same time. Hold the per-pen rate and twice as
         much ink appears per second after the junction as before it, which reads
         as the branches whipping out. Hold the total ink rate instead and each
         branch pen crawls at half the trunk's speed, which reads as the pen
         stalling at the fork. Both are "equal" and neither looks it.

         So the branch phase is weighted by its length times √2 — 29.15 against
         the trunk's 24 — which lands exactly between the two: the ink rate goes
         up by √2 across the junction and the per-pen rate down by the same
         factor. √2 because perceived rate of a simultaneous event scales with
         about the square root of how many of them there are, not linearly.

         Note it lands differently on a fork and a merge, since the trunk is the
         FIRST phase of one and the second of the other.

         LINEAR within a phase, still, and that part is not negotiable: an
         ease-in/ease-out pair across the boundary does not hand off, stepping
         from 6.3 to 4.2 units of ink per unit of time right at the join. What
         punctuates an arrival is the dot's spring, not a decelerating stroke.

         The draw window is 20.57 points of the period and the retract 18, so the
         retract is a little quicker — deliberately. A shape that comes apart at
         exactly the speed it assembled reads as the animation played backwards.
         Both were widened by half again, and the period with them, when the draw
         turned out to be too quick to watch; the HOLDS were not, so the mark
         spends proportionally less of the loop sitting still and more of it
         being made, which is the part worth looking at. */
      @keyframes boot-splash-road-1a {
        0% { stroke-dashoffset: 1.06; animation-timing-function: linear; }
        9.3% { stroke-dashoffset: 0; }
        32% { stroke-dashoffset: 0; animation-timing-function: linear; }
        40.14%,
        100% { stroke-dashoffset: -1.06; }
      }
      @keyframes boot-splash-road-1b {
        0%,
        9.3% { stroke-dashoffset: 1.06; animation-timing-function: linear; }
        20.57% { stroke-dashoffset: 0; }
        40.14% { stroke-dashoffset: 0; animation-timing-function: linear; }
        50%,
        100% { stroke-dashoffset: -1.06; }
      }
      @keyframes boot-splash-road-2a {
        0%,
        50% { stroke-dashoffset: 1.06; animation-timing-function: linear; }
        61.27% { stroke-dashoffset: 0; }
        82% { stroke-dashoffset: 0; animation-timing-function: linear; }
        91.86%,
        100% { stroke-dashoffset: -1.06; }
      }
      @keyframes boot-splash-road-2b {
        0%,
        61.27% { stroke-dashoffset: 1.06; animation-timing-function: linear; }
        70.57% { stroke-dashoffset: 0; }
        91.86% { stroke-dashoffset: 0; animation-timing-function: linear; }
        100% { stroke-dashoffset: -1.06; }
      }

      /*
       * THE DOTS.
       *
       * Placed by their own `cx`/`cy` — no transform trickery, because nothing
       * has to interpolate between two seats any more. `transform-box: fill-box`
       * makes the only transform they carry, the pop, scale each circle about
       * itself wherever it sits on the strip.
       *
       * The scale rides along with the opacity — a dot springs open as the
       * stroke lands on it and collapses as the tail leaves. That spring is the
       * only non-linear easing left anywhere in the loop, and it carries all the
       * punctuation, which is why the strokes themselves can afford to be
       * perfectly flat.
       *
       * Every window straddles a moment the PEN defines, and that is the whole
       * of the tuning: B lands across 20.57%, where the branches reach it; A
       * leaves at 32%, where the trunk's tail lets go of it; C lands across
       * 70.57%.
       * A dot is an end of a stroke, so it appears and disappears when a stroke
       * gets there.
       *
       * B is the long one — segment one's destination and segment two's origin,
       * so it is lit for seven tenths of the cycle while the others take about
       * four each.
       */
      .boot-splash__dot {
        fill: var(--boot-amber);
        transform-box: fill-box;
        transform-origin: center;
        animation-duration: var(--boot-beat);
        animation-iteration-count: infinite;
      }
      /* A dot is dyed by the road that LANDED on it, which is why these are
         three slots and not one: B wears the segment that drew into it while C
         already wears the next, and that is the whole point — after the opening
         mark, one of the three dots on screen never matches the other two. A is
         the odd one, wearing the previous cycle's segment two, because at the
         seam it IS the dot C of the cycle before. */
      .boot-splash__dot--a { fill: var(--c-a, var(--boot-amber)); animation-name: boot-splash-dot-a; }
      .boot-splash__dot--b { fill: var(--c-b, var(--boot-amber)); animation-name: boot-splash-dot-b; }
      .boot-splash__dot--c { fill: var(--c-c, var(--boot-amber)); animation-name: boot-splash-dot-c; }

      /* At the seam, 100% has C alone on the centre line and 0% has A alone on
         it — both a single dot at full size and the same colour, so the two
         frames are identical and two strides of pan reset under them. Do not
         give either of those ends a pop. */
      @keyframes boot-splash-dot-a {
        0%,
        32% { opacity: 1; transform: scale(1); animation-timing-function: cubic-bezier(0.55, 0, 0.75, 0.2); }
        37%,
        100% { opacity: 0; transform: scale(0.35); }
      }
      @keyframes boot-splash-dot-b {
        0%,
        17% { opacity: 0; transform: scale(0.35); animation-timing-function: cubic-bezier(0.22, 1.6, 0.4, 1); }
        23%,
        82% { opacity: 1; transform: scale(1); animation-timing-function: cubic-bezier(0.55, 0, 0.75, 0.2); }
        87%,
        100% { opacity: 0; transform: scale(0.35); }
      }
      @keyframes boot-splash-dot-c {
        0%,
        67% { opacity: 0; transform: scale(0.35); animation-timing-function: cubic-bezier(0.22, 1.6, 0.4, 1); }
        73%,
        100% { opacity: 1; transform: scale(1); }
      }

      /* ── THE EXIT ───────────────────────────────────────────────────────── */

      /* THE PLATE. Full-viewport, behind everything else in the splash, and
         masked so the exit can open a hole in it — see the docblock. While the
         loop runs the hole is `r: 0` and this is simply a flat background.

         `pointer-events: none` because the plate is a sibling of the mark now
         rather than its parent, and the parent is what takes the clicks. */
      .boot-splash__iris {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .boot-splash__iris-plate { fill: var(--boot-bg); }
      .boot-splash__iris-hole { r: 0; }
      /* The ball and the ring are ONE circle: it arrives as a filled dot and
         leaves as an outline, which is the only way the two movements read as
         one thing rather than a dot being swapped for a ring. `--c-ball` is the
         colour of the last road the loop drew (see the script in <head>). */
      .boot-splash__iris-ring {
        r: 0;
        fill: var(--c-ball, var(--boot-amber));
        stroke: var(--c-ball, var(--boot-amber));
        stroke-width: 3;
        fill-opacity: 0;
        stroke-opacity: 0;
      }

      /*
       * MOLD — the pose shrinks into the centre of the view box while the ball
       * swells up under it. See the exit note in the docblock above.
       *
       * ACCELERATING (`0.55, 0, 0.85, 0.35`), so the mark leaves rather than
       * settles, and its opacity is held near full for the first half so that
       * what you see is the logo going rather than the logo fading.
       *
       * The ball is deliberately LATE — it starts at 160ms, when the mark is
       * already small — and springs (`0.22, 1.5, 0.4, 1`). Starting them
       * together read as a cross-fade between two objects; starting the ball
       * late reads as the mark condensing into it.
       *
       * The loop keeps running underneath. Stopping it would freeze the pan
       * mid-slide on a slow boot, which is a worse-looking frame than any the
       * loop produces on its own.
       */
      .boot-splash__collapse {
        transform-box: view-box;
        transform-origin: center;
      }
      #boot-splash[data-done] .boot-splash__collapse {
        animation: boot-splash-mold 400ms cubic-bezier(0.55, 0, 0.85, 0.35) forwards;
      }
      @keyframes boot-splash-mold {
        0% { transform: scale(1); opacity: 1; }
        55% { opacity: 0.92; }
        100% { transform: scale(0.06); opacity: 0; }
      }

      /* The optical lift comes off, so the aperture opens on the true centre of
         the screen rather than 1vh above it. Matched to the mold's duration: by
         the time there is a ball, the ball is where the hole will be. */
      #boot-splash[data-done] .boot-splash__stage {
        animation: boot-splash-settle 420ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      @keyframes boot-splash-settle { to { transform: translateY(1vh); } }

      /*
       * OPEN — the ball becomes the aperture.
       *
       * TWO ANIMATIONS ON ONE ELEMENT, HANDING OVER AT 420ms. The first is
       * `both`, so `r` is pinned at 0 through its delay and holds 13px after;
       * the second is `forwards` and NOT `both`, which is the load-bearing part:
       * `both` would apply its 13px from-value during its own delay and stamp
       * out the ball's spring underneath it. As written, the open contributes
       * nothing until it starts and then picks up at exactly the radius the
       * spring settled on.
       *
       * The fill goes first and fast — by 22% of the open there is no ball left,
       * only a ring with the app inside it — and the stroke comes up to meet it
       * over the first 10%. That crossover IS the moment, so both are inside the
       * same keyframes rather than left to two animations to agree on.
       *
       * `boot-splash-hole` must stay a character-for-character match on `r`,
       * duration, delay and easing. It is the same circle, cut out of the plate.
       */
      #boot-splash[data-done] .boot-splash__iris-ring {
        animation:
          boot-splash-ball 260ms cubic-bezier(0.22, 1.5, 0.4, 1) 160ms both,
          boot-splash-open 580ms cubic-bezier(0.5, 0, 0.35, 1) 420ms forwards;
      }
      @keyframes boot-splash-ball {
        from { r: 0; fill-opacity: 1; stroke-opacity: 0; }
        to { r: 13px; fill-opacity: 1; stroke-opacity: 0; }
      }
      @keyframes boot-splash-open {
        /* `stroke-width` grows with the radius. A 3px ring is the right weight
           around a 26px ball and a hairline around a 1400px one — the edge has
           to keep the presence it starts with or the aperture stops having one.
           It is a stroke, so it straddles: the outer half overhangs the hole by
           `width / 2`, which is 3px at the end and invisible. */
        0% { r: 13px; stroke-width: 3; fill-opacity: 1; stroke-opacity: 0; }
        10% { fill-opacity: 0.5; stroke-opacity: 1; }
        22% { fill-opacity: 0; }
        78% { stroke-opacity: 1; }
        100% { r: 71vmax; stroke-width: 6; fill-opacity: 0; stroke-opacity: 0; }
      }
      #boot-splash[data-done] .boot-splash__iris-hole {
        animation: boot-splash-hole 580ms cubic-bezier(0.5, 0, 0.35, 1) 420ms forwards;
      }
      @keyframes boot-splash-hole {
        from { r: 13px; }
        to { r: 71vmax; }
      }

      /* The corners. Once the hole is past the short edges the plate is four
         slivers and nothing else, and they are better dissolved than left to be
         overtaken — which is also what "fades out of the corners" means. Timed
         to land WITH the ring rather than before it: on a 16:10 window the ring
         crosses the corner at about 870ms, and this is 700→1000. */

        animation: boot-splash-corners 300ms linear 700ms forwards;
      }
      @keyframes boot-splash-corners { to { fill-opacity: 0; } }

      #boot-splash[data-done] { pointer-events: none; }

      /* Added to #root only at the moment of dismissal (bootSplash.ts), never
         before — a bundle that dies on the way here must leave the app opaque,
         not stranded at zero under a splash that will never lift.

         NO DELAY, and done before the hole opens: the aperture is the reveal, so
         the app has to be fully painted behind the plate by the time there is
         anything to see through. Opacity only — a transform here would become
         the containing block for the shell's `position: fixed` children. */
      #root.boot-reveal { animation: boot-splash-reveal 260ms ease-out both; }
      @keyframes boot-splash-reveal { from { opacity: 0; } to { opacity: 1; } }

      @media (prefers-reduced-motion: reduce) {
        /* No drawing, no slide, no collapse — the whole point of the sequence is
           movement, and there is no quieter version of it that still means
           anything. What is left is the mark, held on its first pose, while the
           app loads; and bootSplash.ts drops MIN_MS to 0 to match, so this is a
           brief cover for the load rather than a pose anybody has to sit
           through. Everything downstream of segment one stays hidden — the
           strip only makes sense in motion. */
        .boot-splash__pan,
        .boot-splash__road,
        .boot-splash__dot,
        #boot-splash[data-done] .boot-splash__collapse,
        #boot-splash[data-done] .boot-splash__stage,
        #boot-splash[data-done] .boot-splash__iris-ring,
        #boot-splash[data-done] .boot-splash__iris-hole,
        #boot-splash[data-done] .boot-splash__iris-plate,
        #root.boot-reveal {
          animation: none;
        }
        .boot-splash__road--1a,
        .boot-splash__road--1b { stroke-dashoffset: 0; }
        .boot-splash__road--2a,
        .boot-splash__road--2b,
        .boot-splash__dot--c {
          display: none;
        }
        .boot-splash__dot--a,
        .boot-splash__dot--b { opacity: 1; }
        /* No ball and no aperture — an iris opening across the whole screen is
           the single largest movement in the app, and there is no gentler
           version of it that is still one. What is left is a fade. */
        #boot-splash[data-done] {
          animation: boot-splash-out 200ms linear forwards;
        }
        @keyframes boot-splash-out { to { opacity: 0; } }
      }
    </style>

    <!-- boot-splash:generated:start -->
    <!-- Generated by scripts/generate-brand.mjs — do not edit by hand.
         Styled by the #boot-splash rules in <head>, lifted by src/lib/bootSplash.ts. -->
    <div id="boot-splash" aria-hidden="true">
      <svg class="boot-splash__iris" aria-hidden="true">
        <defs>
          <mask id="boot-splash-aperture" maskUnits="userSpaceOnUse">
            <rect width="100%" height="100%" fill="#fff" />
            <circle class="boot-splash__iris-hole" cx="50%" cy="50%" />
          </mask>
        </defs>
        <rect class="boot-splash__iris-plate" width="100%" height="100%" mask="url(#boot-splash-aperture)" />
        <circle class="boot-splash__iris-ring" cx="50%" cy="50%" />
      </svg>
      <div class="boot-splash__stage">
        <svg class="boot-splash__mark" viewBox="0 0 64 64" aria-hidden="true" style="--bsw: 4.5">
          <g class="boot-splash__collapse">
            <g class="boot-splash__pan">
              <path class="boot-splash__road boot-splash__road--1a" d="M12 32L36 32" pathLength="1" />
              <path class="boot-splash__road boot-splash__road--1b" d="M36 32C42 32 43 22 52 20" pathLength="1" />
              <path class="boot-splash__road boot-splash__road--1b" d="M36 32C42 32 43 42 52 44" pathLength="1" />
              <path class="boot-splash__road boot-splash__road--2b" d="M68 32L92 32" pathLength="1" />
              <path class="boot-splash__road boot-splash__road--2a" d="M52 20C61 22 62 32 68 32" pathLength="1" />
              <path class="boot-splash__road boot-splash__road--2a" d="M52 44C61 42 62 32 68 32" pathLength="1" />
              <circle class="boot-splash__dot boot-splash__dot--a" cx="12" cy="32" r="3.5" />
              <circle class="boot-splash__dot boot-splash__dot--b" cx="52" cy="20" r="3.5" />
              <circle class="boot-splash__dot boot-splash__dot--b" cx="52" cy="44" r="3.5" />
              <circle class="boot-splash__dot boot-splash__dot--c" cx="92" cy="32" r="3.5" />
            </g>
          </g>
        </svg>
        <canvas class="boot-splash__canvas" width="0" height="0" aria-hidden="true"></canvas>
      </div>

<!-- boot-splash:generated:end -->

    <!--
      THE SAME LOOP, DRAWN OFF THE MAIN THREAD.

      Everything the splash animates is a MAIN-THREAD property, and there is no
      arrangement of CSS that changes that. Only `transform`, `opacity` and
      `filter` can run on the compositor, and only on an element that can be
      promoted to its own layer — which an SVG child cannot be, because an SVG
      subtree paints into its parent's layer. So the pan's `transform` is main
      thread; `stroke-dashoffset` is main thread and re-tessellates six dashed
      beziers every frame; `fill-opacity` is not `opacity` and is main thread too.

      Which would be fine if the main thread were free. It is not: this animation
      covers exactly the window in which the bundle is parsed, compiled and
      evaluated and React mounts the shell. Measured at 6x CPU throttle, that is
      1020ms of blocking inside a 3600ms splash — 28% of its life — with a single
      763ms task in the middle. The animation does not get SLOW there, it gets
      ZERO FRAMES. No amount of making it cheaper helps, because it is not being
      out-budgeted, it is being starved.

      So the loop is also drawn into an `OffscreenCanvas` by a worker, which is
      immune by construction. Measured against a deliberately blocked main
      thread: 900ms blocked, 51 worker frames drawn inside it, worst gap 33ms.

      ── THE SVG IS STILL THE ONE THAT MATTERS ───────────────────────────────

      It paints on the FIRST frame, before a byte of JavaScript runs, which is
      the splash's whole reason for existing (see src/lib/bootSplash.ts). A
      worker cannot do that — it needs JS to exist before it can start. So the
      SVG is not a fallback that got demoted; it is still the thing you see
      first, and the canvas takes over a few frames later.

      The handover is one attribute. `data-canvas` on #boot-splash hides the SVG
      with `display: none` — which also STOPS its animations, and that is the
      point, not a side effect: a `visibility: hidden` SVG goes on costing style
      and animation ticks on the very thread being freed. Both renderers read the
      same document clock and the same geometry, so the frame before the swap and
      the frame after it are the same picture.

      If anything is missing — no `OffscreenCanvas`, no `transferControlToOffscreen`,
      a worker that throws, reduced motion — `data-canvas` is never set and the
      splash is exactly what it was. Nothing here is on the critical path.

      ── WHAT IS NOT DUPLICATED, AND WHAT IS ─────────────────────────────────

      NOT the geometry. `Path2D` accepts SVG path data, so the worker is handed
      the `d` strings read straight off the generated SVG — a geometry edit still
      has one source (scripts/generate-brand.mjs) and reaches both renderers.

      NOT the colours. The rotation stays where it was, above; every `set()` is
      announced through `onColour` and forwarded. One bag, one deal.

      THE SCHEDULE IS. The keyframe percentages below are the same numbers as the
      `@keyframes` in the <style>, and CSS cannot read them from JS. That is a
      real duplication and it is pinned by a test — see
      src/lib/bootMarkSchedule.test.ts, which parses the keyframes out of this
      very file and fails if the two drift apart. Change one, change the other,
      and let the test tell you that you did.
    -->
    <script>
      (function () {
        var splash = document.getElementById("boot-splash");
        var canvas = splash && splash.querySelector(".boot-splash__canvas");
        var api = window.__dispatchBootMark;
        if (!canvas || !api || !canvas.transferControlToOffscreen || !window.Worker) return;
        // Reduced motion has no loop to draw; the stylesheet is showing a single
        // held pose and a worker would only animate over the top of it.
        if (typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches) return;

        /*
         * STRINGIFIED, AND THEREFORE CLOSED OVER NOTHING.
         *
         * This function is never called here — it is turned into source and
         * handed to a Blob, so every value it needs arrives by postMessage. A
         * reference to anything in this scope would be a ReferenceError inside
         * the worker and nowhere else, which is the kind of bug that only shows
         * up in production. Keep it self-contained.
         */
        function bootMarkWorker() {
          var ctx = null;
          var cfg = null;
          var offset = 0;
          var colours = {};
          var exitStart = null;
          var announced = false;

          /* Solved by bisection rather than Newton — twenty iterations is about
             1e-6, this runs eleven times a frame, and it cannot fail to
             converge on the springy curves the dots use. */
          function bezier(x1, y1, x2, y2) {
            return function (t) {
              if (t <= 0) return 0;
              if (t >= 1) return 1;
              var lo = 0, hi = 1, u = t, x;
              for (var i = 0; i < 20; i++) {
                u = (lo + hi) / 2;
                x = 3 * (1 - u) * (1 - u) * u * x1 + 3 * (1 - u) * u * u * x2 + u * u * u;
                if (x < t) lo = u; else hi = u;
              }
              return 3 * (1 - u) * (1 - u) * u * y1 + 3 * (1 - u) * u * u * y2 + u * u * u;
            };
          }
          var LINEAR = function (t) { return t; };
          var SPRING = bezier(0.22, 1.6, 0.4, 1);
          var SINK = bezier(0.55, 0, 0.75, 0.2);
          var LEAVE = bezier(0.55, 0, 0.85, 0.35);

          /* A stop is [atPercent, [values...], easingForTheSegmentThatSTARTSHere].
             That is how CSS reads `animation-timing-function` inside a keyframe:
             it governs the interval leaving that stop, not the one arriving. */
          function sample(track, p, out) {
            var i = 0;
            while (i < track.length - 2 && p >= track[i + 1][0]) i++;
            var a = track[i], b = track[i + 1] || a;
            var span = b[0] - a[0];
            var t = span <= 0 ? 0 : (p - a[0]) / span;
            var e = (a[2] || LINEAR)(t < 0 ? 0 : t > 1 ? 1 : t);
            for (var k = 0; k < a[1].length; k++) out[k] = a[1][k] + (b[1][k] - a[1][k]) * e;
            return out;
          }

          // The frame's x, as `32 - midpoint(live ink)`. Linear throughout,
          // because the pen is; see the pan note in index.html's <style>.
          var PAN = [
            [0, [20]], [9.3, [8]], [20.57, [0]], [32, [0]], [40.14, [-12]],
            [50, [-20]], [61.27, [-28]], [70.57, [-40]], [82, [-40]],
            [91.86, [-48]], [100, [-60]],
          ];
          // Dash offset as a FRACTION of each road's own length: +1.06 undrawn,
          // 0 drawn, -1.06 retracted past its end.
          var ROADS = {
            "1a": [[0, [1.06]], [9.3, [0]], [32, [0]], [40.14, [-1.06]], [100, [-1.06]]],
            "1b": [[0, [1.06]], [9.3, [1.06]], [20.57, [0]], [40.14, [0]], [50, [-1.06]], [100, [-1.06]]],
            "2a": [[0, [1.06]], [50, [1.06]], [61.27, [0]], [82, [0]], [91.86, [-1.06]], [100, [-1.06]]],
            "2b": [[0, [1.06]], [61.27, [1.06]], [70.57, [0]], [91.86, [0]], [100, [-1.06]]],
          };
          // [opacity, scale].
          var DOTS = {
            a: [[0, [1, 1]], [32, [1, 1], SINK], [37, [0, 0.35]], [100, [0, 0.35]]],
            b: [[0, [0, 0.35]], [17, [0, 0.35], SPRING], [23, [1, 1]], [82, [1, 1], SINK], [87, [0, 0.35]], [100, [0, 0.35]]],
            c: [[0, [0, 0.35]], [67, [0, 0.35], SPRING], [73, [1, 1]], [100, [1, 1]]],
          };
          /* The exit's mold, as a percentage of its own 400ms, and SPLIT IN TWO
             because CSS interpolates a property across the keyframes that
             declare IT — not across every keyframe. The 55% stop names only
             `opacity`, so scale runs 0 -> 100 in one uneased-at-the-seam span
             while opacity breaks in the middle. Fold them into one track and the
             mark starts fading noticeably earlier than it does today. */
          var MOLD_SCALE = [[0, [1], LEAVE], [100, [0.06]]];
          var MOLD_ALPHA = [[0, [1], LEAVE], [55, [0.92], LEAVE], [100, [0]]];

          var tmp = [0, 0];
          var tmp2 = [0, 0];

          function draw(now) {
            var t = now + offset;
            var p = ((t % cfg.period) / cfg.period) * 100;
            var k = cfg.scale;

            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, cfg.device, cfg.device);
            ctx.setTransform(k, 0, 0, k, cfg.origin, cfg.origin);

            var alpha = 1;
            if (exitStart !== null) {
              var mp = ((now - exitStart) / cfg.moldMs) * 100;
              if (mp >= 100) { self.postMessage({ type: "exit-done" }); return false; }
              alpha = sample(MOLD_ALPHA, mp, tmp)[0];
              var scale = sample(MOLD_SCALE, mp, tmp2)[0];
              // About the view box's centre, like the CSS `transform-origin`.
              ctx.translate(32, 32);
              ctx.scale(scale, scale);
              ctx.translate(-32, -32);
            }

            sample(PAN, p, tmp);
            ctx.translate(tmp[0], 0);

            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.lineWidth = cfg.strokeWidth;
            for (var i = 0; i < cfg.roads.length; i++) {
              var road = cfg.roads[i];
              sample(ROADS[road.phase], p, tmp);
              // `1 3` and the 1.06 overshoot for the same reason the CSS uses
              // them: at exactly +/-1 the dash boundary lands ON the path end,
              // and a zero-length dash under a round cap is a filled dot.
              ctx.setLineDash([road.len, road.len * 3]);
              ctx.lineDashOffset = tmp[0] * road.len * cfg.dashSign;
              ctx.strokeStyle = colours[road.phase.charAt(0) === "1" ? "--c-s1" : "--c-s2"] || cfg.amber;
              ctx.globalAlpha = alpha;
              ctx.stroke(road.path);
            }

            ctx.setLineDash([]);
            for (var j = 0; j < cfg.dots.length; j++) {
              var dot = cfg.dots[j];
              sample(DOTS[dot.id], p, tmp);
              if (tmp[0] <= 0.001) continue;
              ctx.globalAlpha = alpha * tmp[0];
              ctx.fillStyle = colours["--c-" + dot.id] || cfg.amber;
              ctx.beginPath();
              ctx.arc(dot.cx, dot.cy, dot.r * tmp[1], 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.globalAlpha = 1;
            return true;
          }

          function frame(now) {
            if (!ctx || !cfg) return;
            if (draw(now) === false) return;
            if (!announced) { announced = true; self.postMessage({ type: "ready" }); }
            requestAnimationFrame(frame);
          }

          self.onmessage = function (e) {
            var m = e.data;
            if (m.type === "init") {
              ctx = m.canvas.getContext("2d");
              colours = m.colours;
              cfg = m.cfg;
              cfg.roads = m.roads.map(function (r) {
                return { path: new Path2D(r.d), len: r.len, phase: r.phase };
              });
              cfg.dots = m.dots;
              // The document's clock, not ours: a worker's `performance` starts
              // when the worker does, so the two origins are minutes apart on a
              // late start and a paint apart here.
              offset = m.docTime - performance.now();
              requestAnimationFrame(frame);
            } else if (m.type === "colour") {
              colours[m.name] = m.value;
            } else if (m.type === "resize") {
              cfg.device = m.device;
              cfg.scale = m.scale;
              cfg.origin = m.origin;
            } else if (m.type === "exit") {
              // The worker's own clock, deliberately: the mold is measured from
              // the moment the message lands, not from a document time that may
              // already be stale because the main thread was busy sending it.
              exitStart = performance.now();
            }
          };
        }

        var svg = splash.querySelector(".boot-splash__mark");
        var roadEls = [].slice.call(svg.querySelectorAll(".boot-splash__road"));
        var dotEls = [].slice.call(svg.querySelectorAll(".boot-splash__dot"));
        if (!roadEls.length || !dotEls.length) return;

        /*
         * MEASURED OFF A BARE CLONE, and it has to be.
         *
         * Every road carries `pathLength="1"` so the CSS dash maths is
         * normalised — and `getTotalLength()` honours that, returning 1 for all
         * six. Canvas has no such normalisation: `setLineDash` works in real
         * units, so the worker needs each road's TRUE arc length. A probe path
         * with the same `d` and no `pathLength` is the only thing that reports
         * it.
         */
        var probe = document.createElementNS("http://www.w3.org/2000/svg", "path");
        svg.appendChild(probe);
        var roads = roadEls.map(function (el) {
          probe.setAttribute("d", el.getAttribute("d"));
          var phase = (el.className.baseVal.match(/boot-splash__road--(\S+)/) || [])[1];
          return { d: el.getAttribute("d"), len: probe.getTotalLength(), phase: phase };
        });
        svg.removeChild(probe);

        var dots = dotEls.map(function (el) {
          return {
            cx: +el.getAttribute("cx"),
            cy: +el.getAttribute("cy"),
            r: +el.getAttribute("r"),
            id: (el.className.baseVal.match(/boot-splash__dot--(\S+)/) || [])[1],
          };
        });

        var css = getComputedStyle(svg);
        var VIEW_BOX = 64;
        var CSS_SIZE = 320;
        var markPx = parseFloat(css.width) || 116;

        function layout() {
          var dpr = window.devicePixelRatio || 1;
          var device = Math.round(CSS_SIZE * dpr);
          canvas.width = device;
          canvas.height = device;
          return {
            device: device,
            scale: (markPx / VIEW_BOX) * dpr,
            origin: device / 2 - 32 * ((markPx / VIEW_BOX) * dpr),
          };
        }

        var worker;
        var blobUrl;
        try {
          var src = "(" + bootMarkWorker.toString() + ")()";
          blobUrl = URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
          worker = new Worker(blobUrl);
        } catch (err) {
          // No worker, no canvas, and the SVG never stops being correct — but
          // say so. A silent catch here is how this would come to be quietly
          // disabled everywhere (a CSP that forbids `blob:` workers, say) with
          // the splash still looking plausible and nobody any the wiser.
          console.warn("[dispatch] boot mark: canvas renderer unavailable:", err);
          return;
        }

        var seed = {};
        var rootCss = getComputedStyle(document.documentElement);
        ["--c-s1", "--c-s2", "--c-a", "--c-b", "--c-c"].forEach(function (n) {
          seed[n] = rootCss.getPropertyValue(n).trim();
        });
        api.onColour(function (name, value) {
          worker.postMessage({ type: "colour", name: name, value: value });
        });

        /*
          * The worker's rAF loop is the only thing here that outlives the
          * splash, so there has to be a way to end it that is not "play the
          * exit animation".
          *
          * THREE WINDOWS NEVER PLAY ONE. The detached log window, the trace
          * viewer and the mission preview load this same index.html — they
          * inherit the markup and therefore this script, which cannot see the
          * `isShell` check that decides their fate because that is computed in
          * the bundle from the URL. They call `dismissBootSplashNow()`, which
          * takes the splash down with no animation at all. Without this they
          * would each leave a worker redrawing an orphaned canvas, at 60fps,
          * for as long as the window stayed open.
          */
        function stopWorker() {
          if (!worker) return;
          worker.terminate();
          worker = null;
        }
        api.stopCanvas = stopWorker;

        worker.onmessage = function (e) {
          if (blobUrl) {
            // Not synchronously after `new Worker()`: the script fetch may still
            // be in flight there, and revoking the URL out from under it aborts
            // the load silently. Once it has spoken, it has loaded.
            URL.revokeObjectURL(blobUrl);
            blobUrl = null;
          }
          if (e.data.type === "ready") {
            // The one flip. Until it happens the SVG is what you are watching.
            splash.setAttribute("data-canvas", "");
          } else if (e.data.type === "exit-done") {
            // The mold has played out and `frame()` has already stopped
            // scheduling itself; this gives the thread back rather than leaving
            // an idle worker alive until the tab closes.
            canvas.style.opacity = "0";
            stopWorker();
          }
        };
        worker.onerror = function (err) {
          console.warn("[dispatch] boot mark: canvas renderer failed:", err.message || err);
          splash.removeAttribute("data-canvas");
        };

        var geom = layout();
        var off = canvas.transferControlToOffscreen();
        worker.postMessage(
          {
            type: "init",
            canvas: off,
            colours: seed,
            roads: roads,
            dots: dots,
            docTime: document.timeline ? document.timeline.currentTime : performance.now(),
            cfg: {
              period: 2100,
              moldMs: 400,
              strokeWidth: parseFloat(css.getPropertyValue("--bsw")) || 4.5,
              amber: rootCss.getPropertyValue("--boot-amber").trim() || "#e5a33c",
              dashSign: 1,
              device: geom.device,
              scale: geom.scale,
              origin: geom.origin,
            },
          },
          [off],
        );

        addEventListener("resize", function () {
          var g = layout();
          worker.postMessage({ type: "resize", device: g.device, scale: g.scale, origin: g.origin });
        });

        // bootSplash.ts sets `data-done`; the mold is the worker's half of the
        // exit, and the aperture underneath it is still pure CSS on the iris.
        api.onExit = function () {
          if (worker) worker.postMessage({ type: "exit" });
        };
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
