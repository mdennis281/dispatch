# Turn a red run that nobody is watching into a GitHub issue.
#
# WHY THIS EXISTS. A PR's failing check has an audience — `watch_pr` hands it
# straight back to the agent that opened the PR. Everything else does not: a
# `Promote` that dies on a flaky test, a `Release` that fails after merge, a
# weekly `Retention` that stops pruning. Those went red on a page nobody was
# looking at, and the first anyone heard of it was a stable build that never
# arrived. An issue lands where agents and humans already look for work.
#
# WHY `workflow_run` AND NOT A STEP IN EACH WORKFLOW. One reporter covers every
# workflow listed below, including ones added later, and it cannot be skipped by
# the failure it is reporting (a job that `needs:` the gate is one more thing a
# cancelled or mis-`if`ed run can silently drop). `install-smoke.yml` keeps its
# own reporter because it files a structured per-leg table this generic one
# cannot reproduce — so it is deliberately NOT in the list.
#
# WHY NEVER PULL REQUESTS. The PR's own red check is the report there, and a
# fork PR's run must never be able to make this repo file issues.
#
# DEDUPLICATION. One open issue per workflow, updated in place: a failure that
# repeats is a comment on the existing thread, not a fresh issue. That makes a
# FLAKE visible as exactly what it is — a thread that keeps collecting comments
# with different shas — instead of a pile of closed-as-duplicate issues.
name: Failure issue

on:
  workflow_run:
    # `workflow_run` matches on the workflow's `name:`, not its filename.
    workflows: [CI, Release, Promote, Retention, CodeQL]
    types: [completed]

permissions:
  actions: read
  issues: write

jobs:
  report:
    name: file an issue on failure
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so `gh` has no git remote to infer the repo
          # from — see the same note in promote.yml.
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          EVENT: ${{ github.event.workflow_run.event }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          label="ci-failure"
          title="CI failure: $WORKFLOW"

          jobs="$(gh run view "$RUN_ID" --json jobs \
            --jq '.jobs[] | select(.conclusion == "failure") | "- [\(.name)](\(.url))"')"

          # The lines that actually say what broke, so the issue is readable
          # without opening a 10k-line log: vitest's FAIL headers, assertion
          # messages and the runner's own ##[error] annotations. `--log-failed`
          # prefixes every line with "job<TAB>step<TAB>timestamp" and keeps the
          # ANSI colour codes, so both are stripped first. The patterns are
          # anchored on purpose: the server suite logs dozens of EXPECTED
          # "[Dispatch] … Error: …" lines from tests that exercise failure paths,
          # and an unanchored `Error:` buried the one real failure under them.
          # If the log is gone or unreadable the issue still files — with the
          # run link and no excerpt.
          excerpt="$(gh run view "$RUN_ID" --log-failed 2>/dev/null \
            | cut -f3- \
            | sed -E 's/\x1b\[[0-9;]*m//g; s/^[0-9T:.-]+Z //' \
            | grep -E '^ ?FAIL |^##\[error\]|^[A-Za-z]*Error: |^ +× ' \
            | awk '!seen[$0]++' \
            | head -n 40 || true)"

          body="$(cat <<EOF
          **$WORKFLOW** failed on \`$BRANCH\` @ \`${SHA:0:12}\` (event: \`$EVENT\`, attempt $ATTEMPT).

          Run: $RUN_URL
          Title: $RUN_TITLE

          ### Failed jobs
          ${jobs:-_(none reported — the run may have failed before any job started)_}

          ### Excerpt
          \`\`\`
          ${excerpt:-(no error lines found in the failed logs — see the run)}
          \`\`\`

          <sub>Filed by \`.github/workflows/failure-issue.yml\`. Repeat failures of this workflow comment here; close it once the cause is fixed.</sub>
          EOF
          )"
          gh label create "$label" \
            --description "Opened automatically when a workflow fails outside a PR" \
            --color B60205 2>/dev/null || true

          # Match on title as well as label: the label is shared by every
          # workflow, and a Release failure must not be appended to the open
          # Promote thread.
          existing="$(gh issue list --label "$label" --state open --limit 100 \
            --json number,title \
            | jq -r --arg t "$title" 'map(select(.title == $t)) | .[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "updated #$existing" >> "$GITHUB_STEP_SUMMARY"
          else
            url="$(gh issue create --title "$title" --label "$label" --body "$body")"
            echo "opened $url" >> "$GITHUB_STEP_SUMMARY"
          fi
