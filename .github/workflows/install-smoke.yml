# Weekly install + setup smoke: install Dispatch the way a user does, on every
# OS a user has, and prove the result works.
#
# WHY THIS EXISTS. `ci.yml` tests a source checkout with a warm node_modules on
# one self-hosted Linux box plus a Windows subset. It never ran `install.sh`,
# `install.ps1`, `tools/install.mjs`, or `launch.py`, never booted the server
# from a RELEASE PAYLOAD, and never touched macOS at all. So the first person to
# learn that `curl … | sh` on a Mac installed nothing (the symlinked `$TMPDIR`
# bug in `isEntryPoint()`), or that a payload was missing a directory the
# server reads at runtime, was a user. Everything in this file is the part of
# the product that lives OUTSIDE the checkout: the published releases, the
# bootstrap one-liners, the OS launchers, the first-run wizard's probes of the
# machine, and the chat round-trip on top of all of it.
#
# HOSTED RUNNERS ONLY, DELIBERATELY. The point is three clean operating systems
# with nothing pre-warmed. The self-hosted box has a pnpm store, a Python, and
# the previous run's state; that is the opposite of a fresh install.
#
# WHAT IT COSTS. The repo is public, so hosted minutes are free; the matrix is
# 3 OSes × 2 channels ≈ 6 × ~10 min once a week. It also runs on pull requests
# that touch its own files, so a change to the smoke or the installer is proven
# on all three OSes before it merges — and NOT on other PRs, where it would be
# six slow jobs re-checking a release nothing in the PR can affect.
name: Install smoke

on:
  schedule:
    # Mondays 06:15 UTC. Off the hour so it does not queue behind every other
    # project's on-the-hour cron on GitHub's shared fleet.
    - cron: "15 6 * * 1"
  workflow_dispatch:
    inputs:
      channel:
        description: Which channel(s) to install
        type: choice
        default: both
        options: [both, stable, unstable]
      previous:
        description: Release to install FIRST (then update to the head). `auto` = the one before the head; `none` = skip the update phase.
        type: string
        default: auto
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/install-smoke.yml
      - tools/ci/**
      - tools/install.mjs
      - install.sh
      - install.ps1

permissions:
  contents: read

concurrency:
  group: install-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The matrix is computed rather than declared so `workflow_dispatch` can ask
  # for one channel: a static `channel: [stable, unstable]` cannot be filtered
  # by an input, and two `if:`-guarded copies of the job would drift.
  plan:
    name: plan matrix
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      channels: ${{ steps.plan.outputs.channels }}
    steps:
      - id: plan
        run: |
          case "${{ github.event.inputs.channel || 'both' }}" in
            stable)   echo 'channels=["stable"]' >> "$GITHUB_OUTPUT" ;;
            unstable) echo 'channels=["unstable"]' >> "$GITHUB_OUTPUT" ;;
            *)        echo 'channels=["stable","unstable"]' >> "$GITHUB_OUTPUT" ;;
          esac

  smoke:
    name: ${{ matrix.os }} / ${{ matrix.channel }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      # One red leg must not cancel the others: the whole value of a matrix
      # here is learning WHICH OS or channel broke, and a cancelled leg says
      # nothing.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        channel: ${{ fromJSON(needs.plan.outputs.channels) }}
    env:
      # Read by the installer for the release API and by the installed server
      # for its update check; without it six legs share GitHub's anonymous
      # per-IP budget with every other hosted job on the same egress.
      GITHUB_TOKEN: ${{ github.token }}
      # The `gh` probe in the wizard: `gh --version` needs nothing, but
      # `gh api user` with an Actions token is a 403 (it is an installation
      # token, not a user), so the summary will read `authenticated=false`.
      # That is the honest answer for this machine, not a bug.
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      # Node 24 and NOTHING else: no pnpm/action-setup. A user's machine has
      # Node; the installer is what has to find or fetch pnpm (`pnpm` →
      # `corepack pnpm` → `npx pnpm@11.5.0`), and this is the only job that
      # exercises those fallbacks. Corepack's first-use download prompt would
      # otherwise hang a non-interactive run — that is set in the smoke script.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Python is what `launch.py` runs under. The hosted images carry one, but
      # pinning it means the floor the installer enforces (3.10) is the floor
      # the job actually tests, rather than whichever the image shipped.
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A real "installed" answer for the wizard's runtime probe. On Linux and
      # macOS npm links a spawnable `claude` and `codex` onto PATH and the
      # smoke asserts both resolve; on Windows npm leaves `.cmd` shims the
      # runtime resolvers refuse by design, so the install still happens (the
      # probe must cope with it being there) but nothing is asserted.
      - name: Install the Claude Code and Codex CLIs
        run: npm install -g @anthropic-ai/claude-code @openai/codex
        continue-on-error: true

      # ON PULL REQUESTS ONLY: checks whose fix is in this checkout but not yet
      # in any release. The smoke installs PUBLISHED releases, so a PR fixing
      # the server can never make its own run green — the payload under test
      # predates the fix. Listed checks are reported as skipped-with-reason,
      # and a listed check that passes says so, which is the cue to delete the
      # line. The scheduled run passes none of these and stays strict.
      - name: Expectations for an unreleased fix (pull requests only)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          {
            # fix(terminal): POSIX shell backend — terminals were PowerShell-only.
            echo 'SMOKE_EXPECT_UNRELEASED=--expect-unreleased "terminal runs a command in the project"'
          } >> "$GITHUB_ENV"

      - name: Install, set up, exercise, update, restart, reinstall, stop
        shell: bash
        env:
          SMOKE_EXPECT_INSTALLED_CLIS: ${{ runner.os != 'Windows' && '1' || '0' }}
        run: |
          eval "set -- $SMOKE_EXPECT_UNRELEASED"
          node tools/ci/install-smoke.mjs \
            --channel "${{ matrix.channel }}" \
            --previous "${{ github.event.inputs.previous || 'auto' }}" \
            --root "$RUNNER_TEMP/dispatch-smoke" \
            --report "$RUNNER_TEMP/smoke-report/${{ matrix.os }}-${{ matrix.channel }}.json" \
            "$@"

      # The smoke ends with `launch.py --stop`, but a leg that aborted mid-way
      # leaves a detached supervisor holding the port — and on Windows that
      # detached `pythonw` is not in the job's process tree, so the runner would
      # not reap it either.
      - name: Stop anything still running
        if: always()
        shell: bash
        run: |
          root="$RUNNER_TEMP/dispatch-smoke"
          if [ -f "$root/app/tools/app/launch.py" ]; then
            python "$root/app/tools/app/launch.py" --stop --target "$root" || true
          fi

      - name: Upload report and install logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.os }}-${{ matrix.channel }}
          path: |
            ${{ runner.temp }}/smoke-report/
            ${{ runner.temp }}/dispatch-smoke/current.json
            ${{ runner.temp }}/dispatch-smoke/*.log
            ${{ runner.temp }}/dispatch-smoke/data/*.log
          if-no-files-found: ignore
          retention-days: 14

  # A red weekly run nobody is watching is the same as no run. On the scheduled
  # and manual triggers a failure files an issue — ONE issue, updated in place
  # while it stays open, so a bug that persists for four weeks is one thread
  # with four comments and not four issues. Never on pull requests: the PR's
  # own red check is the report there, and a fork's token could not write here
  # anyway.
  report:
    name: file an issue on failure
    needs: smoke
    if: always() && github.event_name != 'pull_request' && contains(needs.smoke.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: smoke-*
          path: reports
          merge-multiple: true

      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          label="install-smoke"
          title="Install smoke failed"

          # One body from every leg's JSON report: which OS × channel failed,
          # and the failing rows themselves, so the issue is readable without
          # opening the run.
          body="$(node --input-type=module -e '
            import { readdirSync, readFileSync } from "node:fs";
            const dir = "reports/smoke-report";
            let files = [];
            try { files = readdirSync(dir).filter((f) => f.endsWith(".json")); } catch {}
            const legs = files.map((f) => JSON.parse(readFileSync(`${dir}/${f}`, "utf8")));
            const bad = legs.filter((l) => !l.ok);
            const lines = [
              `The weekly install smoke found a problem in the install or setup process.`,
              ``,
              `Run: ${process.env.RUN_URL}`,
              ``,
              `| Leg | Result |`, `|---|---|`,
              ...legs.map((l) => `| ${l.platform}/${l.arch} · ${l.channel} | ${l.ok ? "✅ passed" : `❌ ${l.fatal ?? "failed"}`} |`),
              ``,
            ];
            for (const l of bad) {
              lines.push(`### ${l.platform}/${l.arch} · ${l.channel}`, ``);
              for (const r of l.results.filter((r) => r.ok === false)) {
                lines.push(`- ❌ **${r.name}**`, `  ${String(r.detail).replace(/\r?\n/g, " ").slice(0, 600)}`);
              }
              if (l.fatal) lines.push(`- 🛑 ${l.fatal}`);
              for (const n of l.notes ?? []) lines.push(`- ℹ️ ${n}`);
              lines.push(``);
            }
            if (files.length === 0) lines.push(`No per-leg reports were uploaded — a leg failed before the smoke script could write one. See the run.`);
            lines.push(`<sub>Filed by \`.github/workflows/install-smoke.yml\`. Closes itself never; close it when the run is green.</sub>`);
            console.log(lines.join("\n"));
          ')"

          gh label create "$label" --repo "$GITHUB_REPOSITORY" \
            --description "Opened by the weekly install smoke" --color B60205 2>/dev/null || true

          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$label" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            echo "updated #$existing"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label "$label" --body "$body"
          fi
