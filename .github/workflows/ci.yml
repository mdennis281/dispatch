# Dispatch CI — the gate that `workflow.autoMerge: on-green` has been trusting.
#
# WHY THIS EXISTS. `.dispatch/project.yaml` declares `profile: review` with
# `autoMerge: on-green`, and agents are told to land their own PRs once CI is
# green. There was no workflow in this directory, so `watch_pr` answered "no CI
# checks configured" on every PR — "green" was vacuously true and auto-merge was
# gating on nothing at all. This file is what turns that policy from a
# description into an enforcement.
#
# WHY IT IS SHAPED LIKE THIS. The bulk of the work runs on a SELF-HOSTED Linux
# box, because this repo is private and GitHub bills private-repo minutes at 1×
# for Linux and 2× for Windows. The previous layout ran the whole suite on
# `windows-latest` plus a second `ubuntu-latest` leg, which was the single
# largest line on the Actions bill. The self-hosted leg is free; what remains on
# GitHub's dime is one small Windows job covering only what Linux physically
# cannot check.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# This workflow only ever needs to read the tree. Say so explicitly, because the
# default token is broader and `approve_pr` reads these checks to decide whether
# to merge — a check that could rewrite the repo is a poor thing to gate on.
permissions:
  contents: read

# Agents push several times a minute. Without this, a PR costs one run per push
# and the badge is perpetually reporting a commit nobody is looking at any more.
# This matters more with a single self-hosted runner than it did on GitHub's
# elastic fleet: superseded runs would otherwise sit in a queue one deep.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # THE GATE. Everything — build, typecheck, all 1226 tests — on the self-hosted
  # Linux runner (`dispatch-runner`, an 8GB/4-core Proxmox guest). Free, so it
  # runs the full suite rather than a means-tested subset.
  #
  # ⚠️ THIS JOB IS SAFE ONLY WHILE THE REPO IS PRIVATE. A self-hosted runner
  # executes whatever the workflow says, on a box inside the LAN, with the
  # persistent state of every previous job still on disk. On a PUBLIC repo
  # anyone may open a pull request, and GitHub will happily run it here — that
  # is remote code execution on the home network, and it is GitHub's own
  # documented reason for saying not to do this. `.dispatch/` is gitignored
  # "ahead of open-sourcing", so this is a live concern, not a hypothetical.
  # The `if:` below is the guard: a pull request from a FORK does not run on
  # this runner. Before flipping the repo public, decide deliberately what
  # should gate fork PRs — an ephemeral GitHub-hosted job, or nothing.
  # ---------------------------------------------------------------------------
  test:
    name: build + typecheck + test (linux, self-hosted)
    runs-on: [self-hosted, Linux, X64, dispatch]
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4

      # pnpm BEFORE setup-node: `cache: pnpm` shells out to `pnpm store path`,
      # so pnpm has to already be on PATH or the cache step fails.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # Pinned exactly rather than `11`: pnpm-workspace.yaml uses
          # `allowBuilds:` / `minimumReleaseAgeExclude:`, and a --frozen-lockfile
          # install has no business drifting underneath CI.
          version: 11.5.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          # package.json engines says >=20. Pinning the LTS keeps `engines`
          # honest — the author develops on a newer Node, so this is the leg
          # that would notice if the floor quietly rose.
          node-version: 22
          # NO `cache: pnpm` HERE, DELIBERATELY. That option uploads and
          # downloads the pnpm store through GitHub's cache service on every
          # run. This runner is persistent: its pnpm store already survives
          # between jobs on local disk, so a warm install is hardlinks from
          # ~/.local/share/pnpm/store and needs no network at all. Adding the
          # cache action here would make a fast install slower and burn cache
          # quota to do it.

      # `actions/checkout` runs `git clean -ffdx`, which deletes node_modules
      # (gitignored) on every run. That is the correct trade: a self-hosted
      # runner's workspace is otherwise the one place stale build output
      # accumulates forever, and this repo has already been bitten by a stale
      # tsbuildinfo skipping emit. The local store makes the reinstall cheap.
      - name: Install
        run: pnpm install --frozen-lockfile

      # ORDER MATTERS AND IT IS NOT OBVIOUS. `@dispatch/shared` and
      # `@dispatch/cli` expose their types from `dist/` ("types":
      # "./dist/index.d.ts"), so on a CLEAN checkout `typecheck` cannot resolve
      # them until `build` has emitted. This passes locally in either order only
      # because a working tree already has a stale dist/ lying around. Build
      # first, always.
      - name: Build
        run: pnpm build

      # The root had no aggregate typecheck, so all four packages' `typecheck`
      # scripts went unrun by any single command. `pnpm typecheck` (added to the
      # root package.json as `pnpm -r typecheck`) fans out in topological order.
      # This is not redundant with Build: `pnpm build` compiles the client with
      # vite, which strips types WITHOUT checking them, so the SPA's types are
      # checked here and nowhere else.
      - name: Typecheck
        run: pnpm typecheck

      # 1055 tests. The root script covers shared (63) + cli (41) + server (951).
      #
      # The server suite runs here at all only because its Windows-shaped path
      # FIXTURES were made portable. Seventeen tests across four files used
      # literal "C:/wt"-style strings that production code then fed to
      # `path.resolve`; POSIX does not consider those absolute, so it prepended
      # cwd and the assertions read `/…/packages/server/C:/wt/…`. Those fixtures
      # now pick their root from `process.platform`. If you add a test whose
      # fixture is an absolute path, root it the same way or this leg goes red.
      - name: Test (shared, cli, server)
        run: pnpm test

      # The client is deliberately NOT in the root `test` script, which is
      # exactly why CI has to beat `pnpm test` by hand. Its vitest config is a
      # node-environment runner over pure logic (message store, todo-fold,
      # project-draft): 171 tests in ~2s, no DOM, no browser, no server.
      - name: Test (client)
        run: pnpm --filter @dispatch/client exec vitest run

      # DELIBERATELY NOT RUN: `pnpm --filter @dispatch/client e2e` (playwright).
      # Excluded on reliability grounds, and that exclusion is the point of the
      # whole file — a check that is red one run in five teaches everyone to
      # ignore the badge, which is strictly worse than having no check.
      #
      #   * e2e/shell-live.spec.ts picks its port as `40000 + random(15000)`
      #     with NO collision retry, boots a real Fastify server, and allows 45s
      #     for /api/health under a 90s test timeout. That was a coin flip on a
      #     shared runner and is a WORSE bet on this one, where a port may
      #     genuinely be held by another repo's job on the same box.
      #   * e2e/verify-smoke.spec.ts points at an ALREADY-RUNNING cockpit on
      #     127.0.0.1:4319 and skips itself when none answers — in CI it would
      #     assert precisely nothing while still costing a browser download.
      #
      # Run them locally against a real cockpit: pnpm --filter @dispatch/client e2e

  # ---------------------------------------------------------------------------
  # THE WINDOWS SURFACE. The only job that costs money, so it buys exactly one
  # thing: running the platform-branching code on a real Windows host. This
  # application lives on Windows and the Windows-only surface is load-bearing —
  # `needsShell` exists for pnpm's `.cmd` shims, services/processes.ts parses
  # `netstat`, tools/app/paths.mjs resolves %LOCALAPPDATA%, stop-over-stdin
  # exists because Windows has no SIGTERM, and store/fsq.ts retries an
  # EPERM-on-rename that only occurs against a Windows filesystem.
  #
  # WHAT IT DOES NOT DO, AND WHY. It does not run the full suite and it does not
  # run `pnpm build`. The client's vite build is ~3.5 minutes of the old job and
  # produces a bundle no server test imports; at the 2× private-repo multiplier
  # that was the most expensive thing in this file and it was checking nothing
  # Linux had not already checked. Only `@dispatch/shared` and `@dispatch/cli`
  # are built, because the server's types resolve from their dist/.
  #
  # The subset below is the set of test files that either branch on
  # `process.platform` or touch a real filesystem — 137 tests in ~7 seconds.
  # Everything else is platform-agnostic and is covered by the Linux gate.
  # If you add a test that asserts Windows-specific behaviour, add its file here
  # or it will only ever run on a developer's machine.
  # ---------------------------------------------------------------------------
  windows:
    name: windows-specific tests
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Kept here, unlike the self-hosted leg: this runner IS ephemeral, so
          # without the cache every run pays a cold pnpm install at 2× billing.
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # shared + cli only — see the note above on skipping the client build.
      - name: Build (shared + cli)
        run: pnpm --filter @dispatch/shared --filter @dispatch/cli build

      - name: Test (windows-sensitive files)
        run: >
          pnpm --filter @dispatch/server exec vitest run
          src/store/store.test.ts
          src/services/agent-cwd.test.ts
          src/services/runtime.test.ts
          src/services/processes.test.ts
          src/services/terminal.test.ts
          src/services/file-index.test.ts
          src/services/runner.test.ts
          src/routes/fs.test.ts
          src/services/mcp/manager-mcp.integration.test.ts
