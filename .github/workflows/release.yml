# Publishes the UNSTABLE channel: every merge to main, as a GitHub prerelease.
#
# `--prerelease` is the whole channel mechanism. GitHub excludes prereleases
# from `releases/latest`, which is exactly what the server asks for on the
# stable channel — so a merge landing here can never reach a stable subscriber,
# and no code anywhere has to remember to filter it out.
#
# Nothing in this file promotes. A build becomes stable only through
# `promote.yml`, which re-runs the full gate against this same sha and then
# flips THIS release rather than building a second one — so the stable bits are
# bit-identical to the bits that were tested here.
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: build, test, and package release
    # Release reruns the gate against the exact merge SHA because PR checks
    # cover the head commit and a later main push may cancel push CI. The repo
    # is private and this is the same trusted runner as CI and promotion, so the
    # expensive work belongs here instead of on metered hosted Linux.
    runs-on: [self-hosted, Linux, X64, dispatch]
    timeout-minutes: 30
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # No hosted cache: the self-hosted runner's pnpm store persists.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set release version
        id: version
        run: |
          pnpm --filter @dispatch/shared build
          COMMIT_TIME="$(git show -s --format=%cI "$GITHUB_SHA")"
          BUILD_VERSION="$(node --input-type=module -e \
            "import { buildVersion } from './packages/shared/dist/version.js'; console.log(buildVersion(new Date(process.argv[1])))" \
            "$COMMIT_TIME")"
          echo "BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_ENV"
          echo "DISPATCH_BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$BUILD_VERSION" >> "$GITHUB_ENV"
          echo "release_tag=v$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing Dispatch v$BUILD_VERSION from $GITHUB_SHA"

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: |
          pnpm test
          pnpm --filter @dispatch/client exec vitest run

      - name: Assemble release payload
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node tools/release/package.mjs \
            --out release/payload \
            --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA"
          tar -czf "release/dispatch-${RELEASE_TAG}.tar.gz" -C release/payload .
          cd release
          sha256sum "dispatch-${RELEASE_TAG}.tar.gz" > SHA256SUMS

      # The hosted job below publishes these exact bytes rather than rebuilding
      # them on a different machine after the gate has passed.
      - name: Upload tested release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: |
            release/dispatch-${{ steps.version.outputs.release_tag }}.tar.gz
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  publish:
    name: tag and publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}

    steps:
      # Keep this tiny job hosted: `gh` is part of the hosted image but is not
      # guaranteed on a self-hosted runner. Build/test/package consumed nearly
      # all of the old job's billed time; this only tags and uploads.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download tested release assets
        uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release

      - name: Tag successful build
        run: |
          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "Tag $RELEASE_TAG already points to $TAG_SHA, not $GITHUB_SHA" >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Dispatch $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=(
            "release/dispatch-${RELEASE_TAG}.tar.gz"
            release/SHA256SUMS
            install.ps1
            install.sh
            tools/install.mjs
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Re-run of an existing tag: replace the assets, but do NOT touch the
            # prerelease flag. If this tag has already been promoted, forcing it
            # back to prerelease here would silently retract a stable release.
            gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
              --verify-tag \
              --generate-notes \
              --prerelease \
              --title "Dispatch $RELEASE_TAG (unstable)"
          fi
