name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: |
          pnpm test
          pnpm --filter @dispatch/client exec vitest run

      - name: Assemble release payload
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node tools/release/package.mjs \
            --out release/payload \
            --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA"
          tar -czf "release/dispatch-${RELEASE_TAG}.tar.gz" -C release/payload .
          cd release
          sha256sum "dispatch-${RELEASE_TAG}.tar.gz" > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "release/dispatch-${{ github.ref_name }}.tar.gz"
          release/SHA256SUMS
          install.ps1
          install.sh
          --verify-tag
          --generate-notes
          --title "Dispatch ${{ github.ref_name }}"
