name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set release version
        run: |
          pnpm --filter @dispatch/shared build
          COMMIT_TIME="$(git show -s --format=%cI "$GITHUB_SHA")"
          BUILD_VERSION="$(node --input-type=module -e \
            "import { buildVersion } from './packages/shared/dist/version.js'; console.log(buildVersion(new Date(process.argv[1])))" \
            "$COMMIT_TIME")"
          echo "BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_ENV"
          echo "DISPATCH_BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$BUILD_VERSION" >> "$GITHUB_ENV"
          echo "Publishing Dispatch v$BUILD_VERSION from $GITHUB_SHA"

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: |
          pnpm test
          pnpm --filter @dispatch/client exec vitest run

      - name: Assemble release payload
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node tools/release/package.mjs \
            --out release/payload \
            --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA"
          tar -czf "release/dispatch-${RELEASE_TAG}.tar.gz" -C release/payload .
          cd release
          sha256sum "dispatch-${RELEASE_TAG}.tar.gz" > SHA256SUMS

      - name: Tag successful build
        run: |
          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "Tag $RELEASE_TAG already points to $TAG_SHA, not $GITHUB_SHA" >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Dispatch $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=(
            "release/dispatch-${RELEASE_TAG}.tar.gz"
            release/SHA256SUMS
            install.ps1
            install.sh
            tools/install.mjs
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
              --verify-tag \
              --generate-notes \
              --title "Dispatch $RELEASE_TAG"
          fi
