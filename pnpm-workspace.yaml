packages:
  - 'packages/*'
  # Built-in plugins (Claude, Codex, goose): workspace packages so they resolve the
  # host's own @dispatch/shared, and ship in the app payload. See
  # docs/plugins.md → "Providers".
  - 'packages/plugins/*'
  # The example plugins build in CI (`pnpm -r build`) so the client-host
  # contract — a bundle against the globals shim — cannot rot unnoticed.
  - 'examples/plugins/*'
allowBuilds:
  esbuild: true
# pnpm refuses a package younger than its minimum release age, and the Agent SDK
# is the one dependency bumped the day it ships (a stale SDK freezes the model
# picker). These must name the version `packages/plugins/claude` pins, native
# packages included — they sat at 0.3.199 for twenty-odd bumps while the pin
# moved to 0.3.222, so the exclusion protected nothing.
minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.222'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.222'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.222'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.222'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.222'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.222'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.222'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.222'
  - '@anthropic-ai/claude-agent-sdk@0.3.222'
